# Запасной способ публикации через GitHub Actions. Запускается ТОЛЬКО вручную:
# вкладка Actions → «Deploy to GitHub Pages (Actions)» → Run workflow.
# Нужен, только если в Settings → Pages → Source выбрано «GitHub Actions».
# Основной способ — Source: «Deploy from a branch» (см. README), этот workflow тогда не нужен.
name: Deploy to GitHub Pages (Actions)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Не прерываем идущую публикацию: прерванная публикация может «зависнуть» и блокировать следующие.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Tests
        run: node tests/gs1.test.mjs

      - name: Vendor zxing-wasm (curl, без npm)
        run: |
          if [ ! -f vendor/files.json ]; then sh tools/vendor-zxing.sh; fi

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons wasm vendor _site/
          rm -rf _site/wasm/src
          ls -R _site | head -50

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000   # 5 минут вместо 10, чтобы не ждать «зависшую» публикацию
